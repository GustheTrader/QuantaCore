[project]
name = "gnoesis-agenic-research-worker"
version = "0.1.0"
description = "Gnoesis Agenic Research stock research worker"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pytest>=8,<10",
  "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@35543d0248bf89fcb92b17a15858ad0c0e940687",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["svc"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
